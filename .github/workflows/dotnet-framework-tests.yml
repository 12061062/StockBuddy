name: Build and Test StockBuddy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore StockBuddy.sln

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild StockBuddy.sln /p:Configuration=Release

    - name: List test build output
      shell: powershell
      run: |
        Get-ChildItem -Recurse StockBuddyTest\bin

    - name: Find VSTest
      id: find_vstest
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest `
          -products * `
          -property installationPath

        if (-not $vsPath) {
          throw "Visual Studio installation not found."
        }

        $vstest = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"

        if (-not (Test-Path $vstest)) {
          throw "vstest.console.exe not found at $vstest"
        }

        echo "vstest=$vstest" >> $env:GITHUB_OUTPUT

    - name: Run tests
      shell: powershell
      run: |
        & "${{ steps.find_vstest.outputs.vstest }}" "StockBuddyTest\bin\Release\StockBuddyTest.dll"